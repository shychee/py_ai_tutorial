# P04-Telecom 电信客户流失预测配置

data:
  input_file: "../../../../data/stage3/WA_Fn-UseC_-Telco-Customer-Churn.csv"
  test_split: 0.2
  random_seed: 42

model:
  type: "random_forest"
  random_forest:
    n_estimators: 100
    max_depth: 10
    min_samples_split: 10
    min_samples_leaf: 5
    max_features: "sqrt"
    class_weight: "balanced"
    random_state: 42
    n_jobs: -1
  logistic_regression:
    C: 1.0
    penalty: "l2"
    max_iter: 1000
    class_weight: "balanced"
    random_state: 42

visualization:
  style: "seaborn-v0_8"
  palette: "Set2"

paths:
  output_dir: "outputs/"
  models_dir: "outputs/models/"
  figures_dir: "outputs/figures/"
  reports_dir: "outputs/reports/"
  logs_dir: "outputs/logs/"
  model_file: "churn_model.pkl"
  report_file: "report.md"

logging:
  level: "INFO"
  file: "outputs/logs/analysis.log"
  console: true
